spring.application.name=${SPRING_APP_NAME:authservice}
logging.level.org.springframework.security=INFO
spring.profiles.active = default
server.port=8081
logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8180/realms/ecommerce-app/protocol/openid-connect/certs}


# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.gateway.enabled=true

# Logs
logging.level.org.springframework.cloud.gateway=INFO

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=false
logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=INFO


# ================= CORS =================

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${FRONTEND_URL:http://localhost:5173}

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true


