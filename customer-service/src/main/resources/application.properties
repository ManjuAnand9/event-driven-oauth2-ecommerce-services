spring.application.name=customer-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/customerdb
spring.datasource.username=postgres
spring.datasource.password=${CUSTOMER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:8180/realms/ecommerce-app

keycloak.base-url=http://127.0.0.1:8180
keycloak.realm=ecommerce-app
keycloak.client-id=clientApp
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}







