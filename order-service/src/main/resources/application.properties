spring.application.name=order-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/orderdb
spring.datasource.username=postgres
spring.datasource.password=${ORDER_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



# Kafka broker
spring.kafka.bootstrap-servers=localhost:9093

# Topic
spring.kafka.topic=order-events
spring.kafka.template.default-topic=order-events

# Producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.retry.backoff.ms=1000

# Kafka Admin
spring.kafka.admin.properties.bootstrap.servers=localhost:9093