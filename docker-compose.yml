version: "3.8"

services:

  # ==================================================
  # CUSTOMER DATABASE
  # ==================================================
  customer-db:
    image: postgres:16
    container_name: customer-db
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - ./db-init/customerdb.sql:/docker-entrypoint-initdb.d/customerdb.sql


  # ==================================================
  # PRODUCT DATABASE
  # ==================================================
  product-db:
    image: postgres:16
    container_name: product-db
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./db-init/productdb.sql:/docker-entrypoint-initdb.d/productdb.sql


  # ==================================================
  # ORDER DATABASE
  # ==================================================
  order-db:
    image: postgres:16
    container_name: order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - ./db-init/orderdb.sql:/docker-entrypoint-initdb.d/orderdb.sql


  # ==================================================
  # KEYCLOAK DATABASE
  # ==================================================
  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data


  # ==================================================
  # KEYCLOAK
  # ==================================================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      - keycloak-db
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloakdb
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}


  # ==================================================
  # KAFKA
  # Currently commented out because your application
  # configuration uses localhost:9093.
